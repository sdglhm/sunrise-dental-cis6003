<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register appointment - Sunrise Dental Clinic</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"></head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom"><div class="container"><a class="navbar-brand" href="appointments.html">Sunrise Dental</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav me-auto"><a class="nav-link" href="appointments.html">Appointments</a><a class="nav-link" href="patients.html">Patients</a><a class="nav-link" href="catalog.html">Doctors &amp; treatments</a><a class="nav-link active" aria-current="page" href="register.html">Register appointment</a><a class="nav-link" href="reports.html">Reports</a><a class="nav-link" href="help.html">Help</a></div><span class="navbar-text me-3" data-staff-name></span><button class="btn btn-outline-secondary btn-sm" data-logout>Log out</button></div></div></nav>
<main class="container py-4"><div class="row"><div class="col-lg-8"><h1 class="h2">Register an appointment</h1><p class="text-body-secondary mb-4">Enter the patient details and reserve an available time.</p><div id="message" class="d-none" role="status" aria-live="polite"></div>
<form id="appointmentForm" class="card card-body"><div class="row g-3">
    <div class="col-12"><label class="form-label" for="patientId">Existing patient</label><select class="form-select" id="patientId" name="patientId"><option value="">Create a new patient</option></select></div>
    <div class="col-md-6"><label class="form-label" for="patientName">Patient name</label><input class="form-control" id="patientName" name="patientName" autocomplete="name" required></div><div class="col-md-6"><label class="form-label" for="contactNumber">Contact number</label><input class="form-control" id="contactNumber" name="contactNumber" type="tel" autocomplete="tel" placeholder="071 234 5678" required></div>
    <div class="col-12"><label class="form-label" for="address">Address</label><input class="form-control" id="address" name="address" autocomplete="street-address" required></div><div class="col-md-6"><label class="form-label" for="dentistId">Dentist</label><select class="form-select" name="dentistId" id="dentistId" required><option value="">Choose a dentist</option></select></div><div class="col-md-6"><label class="form-label" for="treatmentId">Treatment</label><select class="form-select" name="treatmentId" id="treatmentId" required><option value="">Choose a treatment</option></select></div>
    <div class="col-md-6"><label class="form-label" for="appointmentDate">Appointment date</label><input class="form-control" id="appointmentDate" name="appointmentDate" type="date" required></div><div class="col-md-6"><label class="form-label" for="appointmentTime">Appointment time</label><input class="form-control" id="appointmentTime" name="appointmentTime" type="time" required></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit">Save appointment</button><button class="btn btn-outline-secondary" type="reset">Clear</button></div>
</div></form></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script><script src="assets/common.js"></script><script src="assets/register.js"></script>
</body></html>
