<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Doctors and treatments - Sunrise Dental Clinic</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"></head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom"><div class="container"><a class="navbar-brand" href="appointments.html">Sunrise Dental</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav me-auto"><a class="nav-link" href="appointments.html">Appointments</a><a class="nav-link" href="patients.html">Patients</a><a class="nav-link active" aria-current="page" href="catalog.html">Doctors &amp; treatments</a><a class="nav-link" href="register.html">Register appointment</a><a class="nav-link" href="reports.html">Reports</a><a class="nav-link" href="help.html">Help</a></div><span class="navbar-text me-3" data-staff-name></span><button class="btn btn-outline-secondary btn-sm" data-logout>Log out</button></div></div></nav>
<main class="container py-4"><h1 class="h2">Doctors and treatments</h1><p class="text-body-secondary mb-4">Active dentists and treatments available for appointment registration.</p><div id="message" class="d-none" role="status" aria-live="polite"></div>
<div class="row g-3 mb-4"><form id="dentistForm" class="col-lg-6"><label class="form-label" for="dentistName">Add dentist</label><div class="input-group"><input class="form-control" id="dentistName" name="fullName" required><button class="btn btn-primary" type="submit">Add</button></div></form><form id="treatmentForm" class="col-lg-6"><label class="form-label" for="treatmentName">Add treatment</label><div class="input-group"><input class="form-control" id="treatmentName" name="name" placeholder="Treatment" required><input class="form-control" name="price" type="number" min="0" step="0.01" placeholder="Price" aria-label="Price" required><button class="btn btn-primary" type="submit">Add</button></div></form></div>
<div class="row g-4"><section class="col-lg-6"><h2 class="h4">Dentists</h2><div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Status</th></tr></thead><tbody id="dentistRows"><tr><td colspan="2">Loading dentists...</td></tr></tbody></table></div></section><section class="col-lg-6"><h2 class="h4">Treatments</h2><div class="table-responsive"><table class="table"><thead><tr><th>Treatment</th><th>Price</th></tr></thead><tbody id="treatmentRows"><tr><td colspan="2">Loading treatments...</td></tr></tbody></table></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script><script src="assets/common.js"></script><script src="assets/catalog.js"></script>
