<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Receipt - Sunrise Dental</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="receipt"><h1>Sunrise Dental Clinic</h1><h2>Bill receipt</h2><div id="receipt">Loading…</div><button onclick="window.print()">Print receipt</button></main><script>const n=new URLSearchParams(location.search).get('appointmentNumber');fetch('api/appointments/'+encodeURIComponent(n)+'/bill-preview').then(r=>r.json()).then(b=>document.querySelector('#receipt').innerHTML=`<p>Appointment: ${b.appointmentNumber}</p><p>Patient: ${b.patientName}</p><p>Treatment: ${b.treatmentName}</p><p>Treatment price: Rs. ${b.treatmentPrice}</p><p>Consultation fee: Rs. ${b.consultationFee}</p><h3>Total: Rs. ${b.totalAmount}</h3>`).catch(()=>document.querySelector('#receipt').textContent='Could not load receipt.')</script></body></html>
