<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff login - Sunrise Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-9 col-md-6 col-lg-4">
            <header class="text-center mb-4"><h1 class="h3">Sunrise Dental Clinic</h1><p class="text-body-secondary">Staff sign in</p></header>
            <form id="loginForm" class="card card-body shadow-sm">
                <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" autocomplete="username" required></div>
                <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
                <button class="btn btn-primary" type="submit">Log in</button>
                <div id="loginError" class="alert alert-danger mt-3 mb-0 d-none" role="alert"></div>
            </form>
        </div>
    </div>
</main>
<script src="assets/login.js"></script>
</body>
</html>
