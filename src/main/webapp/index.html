<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunrise Dental Clinic</title><link rel="stylesheet" href="assets/style.css"></head><body><main><h1>Sunrise Dental Clinic</h1><section id="login"><h2>Staff login</h2><form id="loginForm"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Log in</button></form><p id="loginError" class="error"></p></section><section id="app" class="hidden"><p>Signed in as <strong id="staff"></strong> · <button id="logout" class="no-print">Logout</button> · <a href="help.html">Help</a></p><h2>Register appointment</h2><form id="appointmentForm"><input name="patientName" placeholder="Patient name" required><input name="address" placeholder="Address" required><input name="contactNumber" placeholder="Contact number" required><select name="dentistId" id="dentistId" required><option value="">Select a dentist</option></select><select name="treatmentId" id="treatmentId" required><option value="">Select a treatment</option></select><input name="appointmentDate" type="date" required><input name="appointmentTime" type="time" required><button>Save appointment</button></form><p id="message" class="error"></p><section class="catalogue"><h2>Doctors and treatments</h2><form id="dentistForm"><label>Add doctor<input name="fullName" placeholder="Doctor name" required></label><button>Add doctor</button></form><form id="treatmentForm"><label>Add treatment<input name="name" placeholder="Treatment name" required></label><label>Price (Rs.)<input name="price" type="number" min="0" step="0.01" required></label><button>Add treatment</button></form><p id="catalogueMessage" class="error"></p></section><h2>Appointments</h2><button id="load">Refresh list</button><table><thead><tr><th>No.</th><th>Patient</th><th>Dentist</th><th>Date/time</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="assets/app.js"></script></body></html>
