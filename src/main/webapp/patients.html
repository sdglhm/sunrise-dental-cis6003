<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Patients - Sunrise Dental Clinic</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"></head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom"><div class="container"><a class="navbar-brand" href="appointments.html">Sunrise Dental</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav me-auto"><a class="nav-link" href="appointments.html">Appointments</a><a class="nav-link active" aria-current="page" href="patients.html">Patients</a><a class="nav-link" href="catalog.html">Doctors &amp; treatments</a><a class="nav-link" href="register.html">Register appointment</a><a class="nav-link" href="reports.html">Reports</a><a class="nav-link" href="help.html">Help</a></div><span class="navbar-text me-3" data-staff-name></span><button class="btn btn-outline-secondary btn-sm" data-logout>Log out</button></div></div></nav>
<main class="container py-4"><h1 class="h2">Patient management</h1><p class="text-body-secondary">Find patients and keep their contact details current.</p><div id="message" class="d-none" role="status" aria-live="polite"></div>
<div class="row g-2 align-items-end mb-4"><div class="col-sm-7 col-md-5"><label class="form-label" for="patientSearch">Search patients</label><input class="form-control" id="patientSearch" type="search" placeholder="Name or contact number"></div><div class="col-auto"><button id="addPatient" class="btn btn-primary" type="button">Add patient</button></div></div>
<section id="patientEditor" class="card card-body mb-4 d-none"><h2 id="patientEditorTitle" class="h4">Edit patient</h2><form id="patientForm" class="row g-3"><input name="id" type="hidden"><div class="col-md-6"><label class="form-label">Patient name<input class="form-control" name="fullName" required></label></div><div class="col-md-6"><label class="form-label">Contact number<input class="form-control" name="contactNumber" type="tel" required></label></div><div class="col-12"><label class="form-label">Address<input class="form-control" name="address" required></label></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit">Save patient</button><button id="closePatientEditor" class="btn btn-outline-secondary" type="button">Close</button></div></form></section>
<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Patient</th><th>Contact number</th><th>Address</th><th><span class="visually-hidden">Actions</span></th></tr></thead><tbody id="patientRows"><tr><td colspan="4">Loading patients...</td></tr></tbody></table></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script><script src="assets/common.js"></script><script src="assets/patients.js"></script>
</body></html>
